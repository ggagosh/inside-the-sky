[tools]
godot = "4.7.2-stable"
uv = "latest"
"pipx:gdtoolkit" = "4.5.0" # gdformat + gdlint

[tasks.edit]
description = "Open the project in the Godot editor"
run = "godot --path game --editor"

[tasks.play]
description = "Run the game"
run = "godot --path game"

[tasks.import]
description = "Import assets and refresh Godot's caches (needed before headless runs)"
run = "godot --headless --path game --import"

[tasks.test]
description = "Run all tests headless"
depends = ["import"]
run = "godot --headless --path game --script res://tests/run.gd"

[tasks.lint]
description = "Check GDScript formatting and lint rules"
run = ["gdformat --check game", "gdlint game"]

[tasks.fmt]
description = "Format all GDScript"
run = "gdformat game"

[tasks.art]
description = "Convert paintings in art/raw/ into game assets (pass file paths to convert only those)"
run = "uv run --script tools/art.py"

[tasks.test-art]
description = "Check the art converter on generated images"
run = "uv run --script tools/art.py --self-test"

[tasks.check]
description = "Everything CI runs: lint + tests"
depends = ["lint", "test", "test-art"]
